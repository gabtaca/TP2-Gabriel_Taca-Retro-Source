# Single-page app: /products, /faq... exist only inside the React router, so a
# refresh on them must be answered with index.html (without this: 404).
# Real files (images, fonts, sounds, scripts) are NOT rewritten — a missing one
# stays a true 404 instead of silently receiving the page's HTML.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf|wav|mp3|ogg|json|txt|xml|docx)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
